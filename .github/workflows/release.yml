name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Target release version: $TAG_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android Platform 37.0 and Build Tools 37.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build Release and Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --console=plain

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG_NAME: ${{ steps.version_info.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          RELEASE_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT_APK="$RUNNER_TEMP/artifacts/Kepler-${TAG_NAME}.apk"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with provided repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$OUT_APK" \
              "$RELEASE_UNSIGNED"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "No custom keystore secret found; signing with self-signed release key for immediate installation..."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/kepler-auto.jks" \
              -alias kepler \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "kepler-release" \
              -keypass "kepler-release" \
              -dname "CN=Kepler, OU=OpenAudiobook, O=Kepler, C=US"

            "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/kepler-auto.jks" \
              --ks-key-alias kepler \
              --ks-pass "pass:kepler-release" \
              --key-pass "pass:kepler-release" \
              --out "$OUT_APK" \
              "$RELEASE_UNSIGNED"
            rm -f "$RUNNER_TEMP/kepler-auto.jks"
          fi

          echo "Verifying APK signature..."
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$OUT_APK"

          # Copy debug APK as well
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "$RUNNER_TEMP/artifacts/Kepler-${TAG_NAME}-debug.apk"
          fi

          # Generate SHA-256 checksums
          (cd "$RUNNER_TEMP/artifacts" && sha256sum Kepler-*.apk > checksums.txt && cat checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_info.outputs.tag }}
        run: |
          RELEASE_FILES=("$RUNNER_TEMP/artifacts"/*)

          # Check if release already exists
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading/updating assets..."
            gh release upload "$TAG_NAME" "${RELEASE_FILES[@]}" --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" "${RELEASE_FILES[@]}" \
              --title "Kepler $TAG_NAME" \
              --generate-notes
          fi
